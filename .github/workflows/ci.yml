name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows release checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install and audit Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pip-audit
          python -m pip_audit -r requirements.txt

      - name: Install and audit dashboard dependencies
        working-directory: dashboard
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Type-check, localize and build dashboard
        working-directory: dashboard
        run: |
          npm run typecheck
          npm run i18n:check
          npm run build

      - name: Test backend and diagnostic engine
        run: python -m pytest -q

      - name: Build and smoke-test Windows package
        shell: pwsh
        run: .\scripts\build_windows.ps1 -SkipFrontend -SkipTests

      - name: Upload verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MiCochePorDentro-Windows
          path: |
            dist/MiCochePorDentro-*-win-x64.zip
            dist/MiCochePorDentro-*-win-x64.zip.sha256
          if-no-files-found: error
